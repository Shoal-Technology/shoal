apiVersion: v1alpha1
kind: Workload
metadata:
  labels:
    app: api
  name: api
spec:
  env:
  - name: CACHE_HOST
    value: cache.shoal
  - name: LOG_LEVEL
    value: debug
  - name: SESSION_KEY
    valueFrom:
      secret:
        key: SESSION_KEY
        name: api-secrets
  - name: API_TOKEN
    valueFrom:
      secret:
        key: API_TOKEN
        name: api-secrets
  image: ghcr.io/example/api:3.1.0
  ports:
  - containerPort: 8080
  replicas: 1
---
apiVersion: v1alpha1
kind: Service
metadata:
  labels:
    app: api
  name: api
spec:
  ports:
  - port: 80
    protocol: tcp
    targetPort: 8080
  selector: api
