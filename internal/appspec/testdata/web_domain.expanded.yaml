apiVersion: v1alpha1
kind: Workload
metadata:
  labels:
    app: web
  name: web
spec:
  image: nginx:1.27-alpine
  ports:
  - containerPort: 80
  replicas: 1
---
apiVersion: v1alpha1
kind: Service
metadata:
  labels:
    app: web
  name: web
spec:
  ports:
  - port: 80
    protocol: tcp
    targetPort: 80
  selector: web
---
apiVersion: v1alpha1
kind: Route
metadata:
  labels:
    app: web
  name: web
spec:
  host: web.example.com
  pathPrefix: /
  port: 80
  service: web
  tls: auto
