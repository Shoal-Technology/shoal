name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  # release.yml calls this workflow as its test gate.
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test report parser
        run: python3 -m unittest discover -s hack -p 'test_test_report.py'
      - name: Dependency license gate (GPL, LGPL, AGPL and unknown licenses fail)
        run: python3 hack/license_check.py
      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Shell syntax (install.sh is POSIX sh)
        run: |
          sh -n hack/install.sh
          dash -n hack/install.sh
          bash -n hack/test_install.sh
      - name: shellcheck v0.11.0 (sha256 pinned)
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL -o "$archive" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" hack/install.sh hack/test_install.sh
      - name: install.sh tests (local HTTP server, real archive)
        run: bash hack/test_install.sh
      - name: Vet all test variants
        run: make vet
      - name: Tests with race detector
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          go test -race -count=1 -timeout=5m -json ./... | tee test-results/unit.jsonl
          python3 hack/test_report.py test-results/unit.jsonl
      - name: Build CLI
        run: make build && ./bin/shoal --help
      - name: Cross-build CLI for linux/arm64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o bin/shoal-linux-arm64 ./cmd/shoal
      - name: Compile real-runtime integration suite
        run: go test -c -tags integration -o bin/containerd.test ./internal/runtime/containerd
      - name: staticcheck v0.8.1 (x/tools v0.52.0, needed for Go 1.27 export data)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sc" "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/sc"
          go mod init staticcheck-pin >/dev/null 2>&1
          go get honnef.co/go/tools/cmd/staticcheck@v0.8.1 golang.org/x/tools@v0.52.0
          go build -o "$RUNNER_TEMP/bin/staticcheck" honnef.co/go/tools/cmd/staticcheck
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/bin/staticcheck" ./...
      - name: govulncheck v1.2.0
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.2.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-evidence
          path: test-results/
          retention-days: 14

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: gitleaks must see every commit
      - name: Install gitleaks v8.30.1 (sha256 pinned)
        shell: bash
        run: |
          set -euo pipefail
          url=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "$url"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: gitleaks (all refs, full history)
        shell: bash
        run: gitleaks git --config .gitleaks.toml --log-opts="--all" --redact --no-banner --exit-code 1 .
