name: Release
# Runs only for version tags. Not triggered by branches or pull requests.
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
  id-token: write
jobs:
  gate:
    # The full CI test gate (ci.yml, including the install.sh test).
    uses: ./.github/workflows/ci.yml
  release:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install cosign v3.1.3
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Install syft v1.54.1
        uses: anchore/sbom-action/download-syft@v0.24.3
        with:
          syft-version: v1.54.1
      - name: GoReleaser v2.18.3 release
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
