name: Pipeline end to end
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "internal/jobrun/**"
      - "internal/pipeline/**"
      - "internal/agent/**"
      - "internal/build/**"
      - "internal/runtime/**"
      - "internal/resource/**"
      - "internal/server/pipeline*.go"
      - "internal/server/agentpipeline.go"
      - "internal/server/agentbuild.go"
      - "internal/server/buildqueue.go"
      - "internal/server/hooks.go"
      - "internal/server/builds.go"
      - "internal/controller/**"
      - "api/**"
      - "hack/pipeline-e2e.sh"
      - "hack/pipeline-fixture/**"
      - "hack/build-fixture/**"
      - ".github/workflows/pipeline-e2e.yml"
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-24.04
    # Pass C adds a build, two deploys and an approval wait to the run.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # The head commit of a pull request, not its merge commit: the server
          # fetches the pushed commit by sha, and only branch heads are fetched.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install containerd and CNI on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop docker.service docker.socket containerd.service || true
          sudo apt-get update -qq
          sudo apt-get install -y runc iptables iproute2 git
          mkdir -p /tmp/shoal-runtime
          cd /tmp/shoal-runtime
          base=https://github.com/containerd/containerd/releases/download/v2.4.1
          curl -fLsS "$base/containerd-2.4.1-linux-amd64.tar.gz" -o containerd-2.4.1-linux-amd64.tar.gz
          curl -fLsS "$base/containerd-2.4.1-linux-amd64.tar.gz.sha256sum" -o containerd.sha256
          sha256sum -c containerd.sha256
          sudo tar -xzf containerd-2.4.1-linux-amd64.tar.gz -C /usr/local
          base=https://github.com/containernetworking/plugins/releases/download/v1.9.1
          curl -fLsS "$base/cni-plugins-linux-amd64-v1.9.1.tgz" -o cni-plugins-linux-amd64-v1.9.1.tgz
          curl -fLsS "$base/cni-plugins-linux-amd64-v1.9.1.tgz.sha256" -o cni.sha256
          sha256sum -c cni.sha256
          sudo mkdir -p /opt/cni/bin
          sudo tar -xzf cni-plugins-linux-amd64-v1.9.1.tgz -C /opt/cni/bin
          sudo systemd-run --unit=shoal-test-containerd /usr/local/bin/containerd
          for i in $(seq 1 30); do
            if sudo /usr/local/bin/ctr version; then break; fi
            if [ "$i" = 30 ]; then exit 1; fi
            sleep 1
          done
          sudo sysctl -w net.ipv4.ip_forward=1
      - name: Run pipelines with jobs, secrets, build steps, a push webhook, deploys and an approval
        shell: bash
        env:
          # The branch the repository is cloned from: the PR's branch, or the ref of a manual run.
          BUILD_REF: ${{ github.head_ref || github.ref_name }}
          PIPELINE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash hack/pipeline-e2e.sh
      - name: Capture containerd journal
        if: always()
        run: |
          mkdir -p test-results/pipeline-e2e
          sudo journalctl -u shoal-test-containerd --no-pager > test-results/pipeline-e2e/containerd.log || true
      - name: Upload pipeline evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-e2e
          path: test-results/pipeline-e2e
          if-no-files-found: ignore
