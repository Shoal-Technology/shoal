# Desired replicas for `shoal agent --standalone -f examples/standalone.yaml`.
# Edit and save: the agent picks up changes within --sync-interval.
replicas:
  - id: web-1
    workload: web
    image: nginx:1.27-alpine
    ports:
      - containerPort: 80
        hostPort: 8080
    resources: { cpu: 200m, memory: 128Mi }

  # Crashes every 5 seconds to show restarts with backoff.
  - id: crashy
    image: busybox:1.36
    command: ["sh", "-c", "echo starting; sleep 5; echo crashing >&2; exit 1"]
    restartPolicy: Always
