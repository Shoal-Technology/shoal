syntax = "proto3";

package shoal.v1alpha1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Shoal-Technology/shoal/api/v1alpha1;v1alpha1";

// ObjectMeta is common to all objects. Users set only the name; everything
// else is managed by the server.
message ObjectMeta {
  string name = 1;
  string uid = 2;
  // Incremented whenever the spec changes.
  int64 generation = 3;
  // Store revision of the last write (spec or status).
  int64 revision = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  // Labels are key-value pairs set by the user in metadata.labels (ADR 0017).
  // Keys and values follow the Kubernetes label rules; see internal/resource.
  map<string, string> labels = 7;
  // The Project the object belongs to (ADR 0023). Set on writes: empty keeps
  // the object's current project, or uses "default" for a new object. Read
  // back as "default" for every object without a project.
  string project = 8;
}

// Workload is a set of identical replicas of one container.
message Workload {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  WorkloadSpec spec = 4;
  WorkloadStatus status = 5;
}

message WorkloadSpec {
  string image = 1;
  // Defaults to 1.
  optional int32 replicas = 2;
  // Replaces the image's entrypoint and command when set.
  repeated string command = 3;
  repeated EnvVar env = 4;
  repeated Port ports = 5;
  // Used for scheduling and enforced as hard limits.
  Resources resources = 6;
  HealthCheck health_check = 7;
  // Always (default), OnFailure or Never.
  string restart_policy = 8;
  UpdateStrategy update = 9;
  // Secrets and Configs mounted as files: one file per key.
  repeated FileMount files = 10;
  // Set by `shoal restart`; changing it rolls the replicas over.
  google.protobuf.Timestamp restarted_at = 11;
  // Replace (default) permits duplicates during partition. Hold retains lost
  // node assignments, favoring safety over availability; not fencing.
  string partition_policy = 12;
  // Node-local Volumes mounted into the containers (ADR 0016). A Volume is
  // referenced by at most one Workload; see replicas below.
  repeated VolumeMount volumes = 13;
  // Secrets of type kubernetes.io/dockerconfigjson with the registry logins
  // that pull the image (K-19). Read by the server when it builds a snapshot.
  repeated string image_pull_secrets = 14;
}

// VolumeMount mounts the Volume called name at mount_path.
message VolumeMount {
  string name = 1;
  string mount_path = 2;
  bool read_only = 3;
}

message EnvVar {
  string name = 1;
  string value = 2;
  // Takes the value from a Secret or Config key instead. It is read when
  // the container is created; later changes need a restart.
  EnvSource value_from = 3;
}

// EnvSource has exactly one of secret or config.
message EnvSource {
  KeyRef secret = 1;
  KeyRef config = 2;
}

message KeyRef {
  string name = 1;
  string key = 2;
}

// FileMount mounts every key of a Secret or Config (exactly one) as a
// read-only file in the directory path. Changes reach running replicas
// without a restart.
message FileMount {
  string path = 1;
  string secret = 2;
  string config = 3;
}

message Port {
  int32 container_port = 1;
  // Publishes the port on the node; 0 = not published.
  int32 host_port = 2;
  // tcp (default) or udp.
  string protocol = 3;
}

message Resources {
  // CPU, e.g. "200m" or "1".
  string cpu = 1;
  // Memory, e.g. "128Mi".
  string memory = 2;
}

// HealthCheck has exactly one of http, tcp or exec. HTTP and TCP are probed by
// the node's agent on the replica's IP; exec runs a command inside the
// container. A replica is ready after its first passing probe; after
// failure_threshold consecutive failures it is not ready and is restarted.
message HealthCheck {
  HTTPHealthCheck http = 1;
  TCPHealthCheck tcp = 2;
  // Defaults: interval 10s, timeout 2s, 3 failures.
  int32 interval_seconds = 3;
  int32 timeout_seconds = 4;
  int32 failure_threshold = 5;
  // Wait this long after the container starts before the first probe.
  int32 initial_delay_seconds = 6;
  // Passes when the command exits with status 0 (ADR 0016, pass C).
  ExecHealthCheck exec = 7;
}

message HTTPHealthCheck {
  string path = 1;
  int32 port = 2;
}

message TCPHealthCheck {
  int32 port = 1;
}

message ExecHealthCheck {
  // argv of the command. It runs without a shell, inside the container.
  repeated string command = 1;
}

message UpdateStrategy {
  // Replicas that may be unavailable during an update. Defaults to 1.
  optional int32 max_unavailable = 1;
  // An updated replica that isn't ready this long after being updated fails
  // the rollout, which is then rolled back. Defaults to 120.
  int32 progress_deadline_seconds = 2;
}

message WorkloadStatus {
  // Replicas that exist (scheduled or not).
  int32 replicas = 1;
  // Replicas that are ready (running and passing their health check).
  int32 ready_replicas = 2;
  // Workload generation the status was computed for.
  int64 observed_generation = 3;
  // Replicas running the template being rolled out.
  int32 updated_replicas = 4;
  RolloutStatus rollout = 5;
}

// RolloutStatus tracks rolling updates of a workload's template.
message RolloutStatus {
  // Progressing, Complete, RolledBack or Failed.
  string phase = 1;
  // Last template that was fully rolled out, and its workload generation:
  // the rollback target.
  WorkloadSpec stable_template = 2;
  int64 stable_generation = 3;
  // Generation whose rollout failed; it is not retried until the spec
  // changes again.
  int64 failed_generation = 4;
  string message = 5;
}

// Replica is one instance of a workload. Replicas are created and deleted by
// the server; users can list them and delete one to have it replaced.
message Replica {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  ReplicaSpec spec = 4;
  ReplicaStatus status = 5;
}

message ReplicaSpec {
  string workload = 1;
  // Node the replica runs on; empty until it is scheduled.
  string node = 2;
  // What the replica runs: the workload spec without replicas and update,
  // so scaling doesn't touch existing replicas.
  WorkloadSpec template = 3;
  // Workload generation the template was taken from.
  int64 template_generation = 4;
  // When the template was last set; an update that isn't ready within the
  // workload's progress deadline fails the rollout.
  google.protobuf.Timestamp template_updated_at = 5;
  // A backup or restore the agent runs in this replica (ADR 0016, pass D).
  // A replica runs one job at a time: a new job is set only after the result
  // of the previous one is in the status.
  DatabaseJob job = 6;
}

message ReplicaStatus {
  // Pending, Running, Succeeded, Failed or Stopped.
  string phase = 1;
  int32 restarts = 2;
  int32 exit_code = 3;
  string ip = 4;
  google.protobuf.Timestamp started_at = 5;
  // Why the replica is not running or not ready (e.g. unschedulable,
  // pulling image, health check failing).
  string message = 6;
  // Running and passing its health check (or running, without one).
  bool ready = 7;
  // Template generation the reporting agent runs; the status describes the
  // replica's current template only when this equals
  // spec.template_generation.
  int64 template_generation = 8;
  // The result of the job whose ID is the spec's job ID, once it has run.
  DatabaseJobResult job = 9;
}

// Node is a worker that has joined the cluster. Nodes are created by Join and
// can only be deleted by users.
message Node {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  NodeSpec spec = 4;
  NodeStatus status = 5;
}

message NodeSpec {
  // Subnet for the node's containers, assigned by the server from the
  // cluster CIDR.
  string pod_cidr = 1;
  // Labels set by the operator with `shoal label node`. shoal.dev/edge=true
  // makes the node an ingress edge (ADR 0015).
  map<string, string> labels = 2;
}

message NodeStatus {
  // Ready or NotReady.
  string phase = 1;
  google.protobuf.Timestamp last_heartbeat = 2;
  // Address of the agent as seen by the server.
  string address = 3;
  NodeCapacity capacity = 4;
  string agent_version = 5;
  string os = 6;
  string arch = 7;
  // WireGuard mesh: the node's public key and host:port peers connect to.
  string wireguard_public_key = 8;
  string wireguard_endpoint = 9;
  // Volume backend the agent actually uses: loop or dir (ADR 0016).
  string volume_backend = 10;
}

message NodeCapacity {
  int64 cpu_millis = 1;
  int64 memory_bytes = 2;
  // Bytes of the filesystem that holds the agent's volumes (0 = unknown).
  // Volume sizes are counted against it by the scheduler.
  int64 disk_bytes = 3;
}

// Volume is node-local storage (ADR 0016, section 1). It is bound to the node
// of the first replica that mounts it and does not move in v1.
message Volume {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  VolumeSpec spec = 4;
  VolumeStatus status = 5;
}

message VolumeSpec {
  // Quantity, e.g. "20Gi". Enforced by the loop backend; advisory for dir.
  string size = 1;
  // Only "RWO" in v1. Empty means RWO.
  string access_mode = 2;
  // Owner of the volume's root directory, applied at create. Default 0:0.
  VolumeOwner owner = 3;
  // Octal permissions of the root directory, e.g. "0700" (default).
  string mode = 4;
  // Retain (default) or Delete. What happens to the data when the Volume
  // object is deleted.
  string retention = 5;
}

message VolumeOwner {
  int32 uid = 1;
  int32 gid = 2;
}

message VolumeStatus {
  // Node the volume is bound to; empty until its first replica is bound.
  string node = 1;
  // Pending, Bound or NodeLost.
  string state = 2;
  // Why the volume is in its state, when it is not simply Bound.
  string message = 3;
  // Workload that references the volume, if any.
  string attached_workload = 4;
  // Quota enforcement on the node: size (loop backend) or none (dir).
  string quota = 5;
  // Bytes used. Reported by the agent in a later pass; zero in pass A.
  int64 used_bytes = 6;
}

// Database is a managed database (ADR 0016, section 3). The controller expands
// it into a Volume, a Workload, a Service and a credentials Secret, all owned
// by the Database: users manage only the Database.
message Database {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  DatabaseSpec spec = 4;
  DatabaseStatus status = 5;
}

message DatabaseSpec {
  // Only "postgres" in this pass. Redis is pass E.
  string engine = 1;
  // A major or major.minor from the pinned image table: "16" runs the newest
  // 16.x (16.15 today), "16.14" runs exactly 16.14.
  string version = 2;
  // Storage of the data Volume, e.g. "5Gi". Fixed after creation in v1.
  string size = 3;
  // Defaults: cpu 500m, memory 384Mi (ADR 0017).
  Resources resources = 4;
  // Fixed at 1 in v1. Unset means 1.
  optional int32 replicas = 5;
  // Optional scheduled logical backups (ADR 0016, section 3.4).
  DatabaseBackup backup = 6;
  // Optional backup ID (a DatabaseBackupRecord) to restore into this new
  // Database. Refused for a Database that already exists (section 3.7).
  string restore_from = 7;
}

message DatabaseBackup {
  // Interval between backups, e.g. "24h". At least 1h.
  string schedule = 1;
  // Backups kept per target, from 1 to 365.
  int32 retain = 2;
  // volume (a backup Volume) and/or s3 (a BackupTarget).
  repeated string targets = 3;
  // BackupTarget name. Required when targets includes s3.
  string s3 = 4;
}

message DatabaseStatus {
  // Provisioning, Ready, Degraded or Failed.
  string phase = 1;
  // Why the phase is not Ready, or what was refused.
  string message = 2;
  // Name and port clients connect to, e.g. app-db.shoal:5432.
  string endpoint = 3;
  // Version of the image the database runs.
  string version = 4;
  // State of the restore_from restore: pending, running, done or failed.
  // Empty for a Database that was not restored.
  string restore_state = 5;
}

// DatabaseJob is a backup or restore the agent runs in a database replica
// with exec (ADR 0016, pass D).
message DatabaseJob {
  string id = 1;
  // "backup" or "restore".
  string kind = 2;
  // backup: the dump file to write in the container. restore: the dump to load.
  string file = 3;
  // The database: the one dumped (backup) or the one loaded into (restore).
  string database = 4;
  // restore: the host to connect to, e.g. blog-db-restored.shoal.
  string target = 5;
  // backup: files to delete after the dump is written (retention).
  repeated string prune = 6;
  // restore: the SHA-256 the dump must have before it is loaded.
  string sha256 = 7;
}

// DatabaseJobResult is what the agent reports for a DatabaseJob.
message DatabaseJobResult {
  string id = 1;
  bool ok = 2;
  // backup: the size and SHA-256 of the dump.
  int64 size = 3;
  string sha256 = 4;
  // Why the job failed, or a non-fatal problem when ok (e.g. a file that
  // could not be pruned). It never contains a password.
  string error = 5;
}

// DatabaseBackupRecord is one logical backup of a Database, kept by the server
// (ADR 0016, section 3.4). Its name is the backup ID.
message DatabaseBackupRecord {
  string id = 1;
  string database = 2;
  google.protobuf.Timestamp created_at = 3;
  // The dump file in the database container.
  string file = 4;
  int64 size = 5;
  string sha256 = 6;
  // pending, running, ok or failed.
  string status = 7;
  string error = 8;
  // scheduled, manual or upgrade.
  string reason = 9;
  // The engine version the dump was taken from.
  string version = 10;
}

// Secret holds sensitive key-value data. It is encrypted at rest and its
// values are never returned by the API.
message Secret {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  SecretSpec spec = 4;
}

message SecretSpec {
  map<string, string> data = 1;
  // Opaque (default), kubernetes.io/dockerconfigjson or kubernetes.io/tls.
  // The data is checked against the type on every apply (K-28).
  string type = 2;
}

// RegistryCredential is one registry login, taken from a dockerconfigjson
// Secret. The server sends it to the nodes that pull the image.
message RegistryCredential {
  string host = 1;
  string username = 2;
  string password = 3;
}

// Config holds plain key-value configuration.
message Config {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  ConfigSpec spec = 4;
}

message ConfigSpec {
  map<string, string> data = 1;
}

// Service gives the ready replicas of a workload a stable virtual IP and a
// DNS name (<name>.shoal), reachable from containers on any node.
message Service {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  ServiceSpec spec = 4;
  ServiceStatus status = 5;
}

message ServiceSpec {
  // Workload whose ready replicas receive the traffic.
  string selector = 1;
  repeated ServicePort ports = 2;
}

message ServicePort {
  int32 port = 1;
  // Defaults to port.
  int32 target_port = 2;
  // tcp (default) or udp.
  string protocol = 3;
}

message ServiceStatus {
  string cluster_ip = 1;
  // IPs of the ready replicas.
  repeated string endpoints = 2;
}

// Route maps one host and path prefix to one Service port. Pass A only
// stores and validates Routes; the edge that serves them is ADR 0015.
message Route {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  RouteSpec spec = 4;
  RouteStatus status = 5;
}

message RouteSpec {
  // Lowercase DNS name, no IP, no wildcard.
  string host = 1;
  // Defaults to "/". Longest prefix wins when several Routes match.
  string path_prefix = 2;
  // Service name (cluster-wide).
  string service = 3;
  // Service port, not the target port.
  int32 port = 4;
  // auto (default), none or secret. A string, like the other policy fields,
  // so the YAML values are the lowercase words.
  string tls = 5;
  // Required with tls secret: a Secret holding PEM certificate and key.
  string tls_secret = 6;
  // Defaults to true when tls is not none.
  optional bool redirect_http = 7;
}

message RouteStatus {
  // Ready, or the first reason the route is not ready. Set by the controller.
  string state = 1;
  string message = 2;
  // For tls auto: CertPending, CertIssued or CertError. Empty otherwise.
  // Set by the controller from the Certificate record (ADR 0015, pass C).
  string cert_state = 3;
  // Why the certificate is in CertError, or empty.
  string cert_message = 4;
  // Expiry of the issued certificate, set when cert_state is CertIssued.
  google.protobuf.Timestamp cert_not_after = 5;
}

// Certificate is internal: the automatic TLS certificate for one host. Its
// name is the host. The spec holds the private key and is encrypted at rest.
message Certificate {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  CertificateSpec spec = 4;
  CertificateStatus status = 5;
}

message CertificateSpec {
  // PEM chain, leaf first. Empty until the first issuance succeeds.
  string chain_pem = 1;
  // PEM EC private key (P-256) for the leaf.
  string key_pem = 2;
}

message CertificateStatus {
  google.protobuf.Timestamp not_before = 1;
  google.protobuf.Timestamp not_after = 2;
  string issuer = 3;
  // The last failure, empty after a success.
  string last_error = 4;
  // Earliest time the next attempt may run (backoff or Retry-After).
  google.protobuf.Timestamp next_attempt = 5;
  // Consecutive failures; drives the backoff.
  int32 failures = 6;
}

// AcmeAccount is internal: the ACME account for one directory URL (the name).
message AcmeAccount {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  AcmeAccountSpec spec = 4;
  AcmeAccountStatus status = 5;
}

message AcmeAccountSpec {
  // PEM EC private key (P-256) of the account. Encrypted at rest.
  string account_key_pem = 1;
  string directory_url = 2;
  string email = 3;
}

message AcmeAccountStatus {
  string registration_uri = 1;
}

// AcmeChallenge is internal: one pending HTTP-01 token. The name is the token.
message AcmeChallenge {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  AcmeChallengeSpec spec = 4;
}

message AcmeChallengeSpec {
  string host = 1;
  string key_authorization = 2;
  google.protobuf.Timestamp expires_at = 3;
}

// UIAuthSpec is internal: the web portal's admin password hash.
message UIAuthSpec {
  bytes password_hash = 1;
  google.protobuf.Timestamp changed_at = 2;
}

// JoinToken is internal: it is never returned by the API.
message JoinToken {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  JoinTokenSpec spec = 4;
}

message JoinTokenSpec {
  // SHA-256 of the token secret; the secret itself is never stored.
  bytes secret_hash = 1;
  google.protobuf.Timestamp expires_at = 2;
  // 0 = unlimited.
  int32 max_uses = 3;
  int32 uses = 4;
  string description = 5;
}

// ImageTagSpec is one tag of the embedded registry: the manifest digest it
// points to (ADR 0020). The server writes it on each tag push; it is not
// applied by users.
message ImageTagSpec {
  string repository = 1;
  string tag = 2;
  string digest = 3;
  string media_type = 4;
}

// BuildConfig is a recipe that builds an image from a git repository (ADR
// 0021, OB-01). Each run is a Build.
message BuildConfig {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  BuildConfigSpec spec = 4;
  BuildConfigStatus status = 5;
}

message BuildConfigSpec {
  GitSource git = 1;
  // Name of a Secret with the credentials for git: kubernetes.io/basic-auth
  // for an https URL, kubernetes.io/ssh-auth for an ssh URL. Empty for a
  // public repository.
  string credentials_secret = 2;
  BuildOutput output = 3;
  // Dockerfile build arguments (ARG values).
  map<string, string> build_args = 4;
  // Starts a Build when a git host pushes to a branch (ADR 0021, pass C).
  BuildWebhook webhook = 5;
  // Rolls a Workload out to the digest of a completed Build (OB-45).
  BuildOnSuccess on_success = 6;
}

// BuildWebhook lets a git host start a Build by calling the portal at
// /hooks/v1/<config uid> (OB-11, OB-12, GL-02). Each request is checked with
// the secret.
message BuildWebhook {
  // github, gitlab, gitea or generic.
  string provider = 1;
  // Name of an Opaque Secret whose webhook-secret key holds the shared secret.
  string secret = 2;
  // Branch whose pushes start a Build. Defaults to the config's ref; required
  // when the ref is HEAD.
  string branch = 3;
}

// BuildOnSuccess names the Workload that a completed Build updates (OB-45).
message BuildOnSuccess {
  // The Workload whose image becomes shoal.local/<repository>@<digest>.
  string update_workload = 1;
}

message GitSource {
  // https://host/path or ssh://, or git@host:path. Credentials never go in the URL.
  string url = 1;
  // A branch, tag or commit. HEAD means the repository's default branch.
  string ref = 2;
  // Build context, relative to the repository root. Defaults to ".".
  string context_dir = 3;
  // Dockerfile, relative to the context directory. Defaults to Dockerfile.
  string dockerfile = 4;
}

message BuildOutput {
  // Repository in the embedded registry. Defaults to the BuildConfig's name.
  string repository = 1;
  // Tag template: {short-sha} (default), {sha} or {ref}.
  string tag = 2;
}

message BuildConfigStatus {
  // The newest Build of this config, and its phase. Set by the controller.
  string last_build = 1;
  string last_phase = 2;
}

// Build is one run of a BuildConfig (ADR 0021, OB-02). The server creates it
// from the config's spec at start time; the controller owns the status.
message Build {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  BuildSpec spec = 4;
  BuildStatus status = 5;
}

message BuildSpec {
  // The BuildConfig this run came from.
  string config = 1;
  // The config's spec when the run was started. Later edits do not change it.
  BuildConfigSpec source = 2;
  // manual (StartBuild) or webhook (a git push).
  string trigger = 3;
  // Set by CancelBuild. The controller stops the run and sets Cancelled.
  bool cancel_requested = 4;
}

message BuildStatus {
  // New, Pending, Running, Complete, Failed, Error or Cancelled. The names
  // follow OpenShift's BuildPhase (OB-02). Error is an infrastructure failure
  // (no executor, or the job could not start or was lost); Failed is a build
  // that ran and failed.
  string phase = 1;
  string message = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp finished_at = 4;
  // Commit the build resolved to. Set on success.
  string commit = 5;
  // repository:tag that was pushed. Set on success.
  string image = 6;
  // Manifest digest of the pushed image. Set on success.
  string digest = 7;
  // Name of the log stream the executor writes (OB-20). Set when the run starts.
  string log_ref = 8;
  // The Workload whose image was set to this Build's digest (OB-45). Set once.
  string workload_updated = 9;
}

// Pipeline is the definition of the pipeline of one repository (ADR 0022).
// Each execution is a PipelineRun. The jobs come from the repository's
// shoal-ci.yml, copied into each run.
message Pipeline {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  PipelineSpec spec = 4;
  PipelineStatus status = 5;
}

message PipelineSpec {
  // A git URL, checked as BuildConfig's git URL is (ADR 0021).
  string repo = 1;
  // Branch, tag or commit that manual runs read. Defaults to HEAD.
  string ref = 2;
  // File inside the repository. Defaults to shoal-ci.yml.
  string path = 3;
  // Name of a Secret for the clone, as in ADR 0021.
  string credentials_secret = 4;
  // Branches whose pushes start protected runs (ADR 0022, section 7). Empty
  // means the default, main. Set by the server when the Pipeline is applied.
  repeated string protected_branches = 5;
}

message PipelineStatus {
  // The newest run of this pipeline, and its phase. Set by the controller.
  string last_run = 1;
  string last_phase = 2;
}

// PipelineRun is one execution of a Pipeline (ADR 0022). The server creates
// it; the controller expands it into Jobs and owns its status.
message PipelineRun {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  PipelineRunSpec spec = 4;
  PipelineRunStatus status = 5;
}

message PipelineRunSpec {
  // The Pipeline this run came from.
  string pipeline = 1;
  // The parsed shoal-ci.yml, taken when the run was created. Later commits do
  // not change a run.
  PipelineSource source = 2;
  // manual, push, pull_request or tag.
  string trigger = 3;
  // The commit that was read, and the ref it was read from.
  string commit = 4;
  string ref = 5;
  // protected, same-repo or fork. Set by the server, never by the file (ADR
  // 0022, section 7).
  string trust = 6;
  // Set by CancelPipelineRun. The controller stops the run.
  bool cancel_requested = 7;
  // Paths changed in the commit range. Used by changes rules.
  repeated string changed_paths = 8;
}

message PipelineRunStatus {
  // New, Running, Complete, Failed, Error or Cancelled.
  string phase = 1;
  string message = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp finished_at = 4;
  // Variables the run's jobs see, set by build steps once they complete (ADR
  // 0022, section 4). Keys are SHOAL_BUILD_<JOB>_IMAGE and
  // SHOAL_BUILD_<JOB>_DIGEST, where JOB is the build job's name in upper case
  // with dashes as underscores. Values are set by the controller only.
  map<string, string> outputs = 5;
}

// PipelineSource is a parsed shoal-ci.yml.
message PipelineSource {
  // Stage names, in the order they run.
  repeated string stages = 1;
  // Variables of every job of the run.
  map<string, string> variables = 2;
  // Jobs in the order they appear in the file.
  repeated PipelineJob jobs = 3;
}

// PipelineJob is one job as written in shoal-ci.yml.
message PipelineJob {
  string name = 1;
  string stage = 2;
  // Jobs of earlier stages this job waits for.
  repeated string needs = 3;
  string image = 4;
  repeated string script = 5;
  map<string, string> variables = 6;
  repeated string tags = 7;
  // on_success, always, manual or never. Used when the job has no rules.
  string when = 8;
  bool allow_failure = 9;
  repeated PipelineRule rules = 10;
  google.protobuf.Duration timeout = 11;
  JobRetry retry = 12;
  JobCache cache = 13;
  JobArtifacts artifacts = 14;
  // Environment variable name to Secret reference. Values are never stored.
  map<string, SecretRef> secrets = 15;
  // Name of a BuildConfig. A build job starts a Build (ADR 0021).
  string build = 16;
  JobDeploy deploy = 17;
  JobEnvironment environment = 18;
}

// PipelineRule is one entry of a job's rules.
message PipelineRule {
  // branch == "name", tag == true, event == "push" joined by &&. Empty when
  // the rule has no condition.
  string condition = 1;
  // Glob patterns over the changed paths. Empty when the rule has none.
  repeated string changes = 2;
  // on_success, always, manual or never. Empty means on_success.
  string when = 3;
}

message JobRetry {
  int32 max = 1;
  // runner_error and node_lost are the only reasons retried (ADR 0022,
  // section 5).
  repeated string when = 2;
}

message JobCache {
  string key = 1;
  repeated string paths = 2;
}

message JobArtifacts {
  repeated string paths = 1;
  google.protobuf.Duration expire_in = 2;
}

message SecretRef {
  string secret = 1;
  string key = 2;
}

message JobDeploy {
  string workload = 1;
  // A build job of an earlier stage whose digest the deploy uses.
  string from = 2;
}

message JobEnvironment {
  string name = 1;
  // Only "required" is accepted. The gate is pass C.
  string approval = 2;
}

// Job is one job of one PipelineRun (ADR 0022, section 4). The controller
// creates it and owns its status.
message Job {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  JobSpec spec = 4;
  JobStatus status = 5;
}

message JobSpec {
  // The PipelineRun this job belongs to.
  string pipeline_run = 1;
  // The job as written in the file.
  PipelineJob job = 2;
  // The when after rules were applied. A job with no rules keeps its own.
  string when = 3;
  bool allow_failure = 4;
  // Variables the job runs with: the run's, then the job's. No secret values.
  map<string, string> env = 5;
  // Set by PlayJob. The controller starts a manual job that was asked to run.
  bool play_requested = 6;
  // Approvals and rejections asked of this job at its environment's gate, in
  // the order the server recorded them. Written by ApproveJob and RejectJob.
  repeated JobApproval approvals = 7;
}

// JobApproval is one decision on a job at an approval gate (ADR 0022, section
// 10). The approver is the caller's identity, never a value from the file.
message JobApproval {
  // approved or rejected.
  string decision = 1;
  string by = 2;
  google.protobuf.Timestamp at = 3;
  string comment = 4;
}

message JobStatus {
  // New, Pending, Running, Manual, Complete, Failed, Error, Cancelled or
  // Skipped. Error is an infrastructure failure; Failed is a job that ran
  // and failed.
  string phase = 1;
  string message = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp finished_at = 4;
  string node = 5;
  int32 exit_code = 6;
  // Tries so far, counting the first (retry).
  int32 attempt = 7;
  // Name of the log stream the runner writes.
  string log_ref = 8;
  // Build step: the Build it started.
  string build = 9;
  // Build step: the repository:tag and digest the Build pushed. Deploy step:
  // the image and digest it set the Workload to.
  string image = 10;
  string digest = 11;
  // Approvals recorded at the environment gate, as the controller saw them.
  repeated JobApproval approvals = 12;
  // When the job began to wait for approval. The wait times out (ADR 0022).
  google.protobuf.Timestamp waiting_since = 13;
  // Deploy step: the workload generation the deploy set. The rollout is
  // complete when the Workload's rollout reaches this generation.
  int64 workload_generation = 14;
  // Deploy step: sha256 (hex) of the run-scoped deploy token, present while the
  // deploy runs. The token itself is never stored (ADR 0022, section 5).
  string token_hash = 15;
}
// Project scopes names, quotas and, later, roles (ADR 0023). It is
// cluster-scoped. The "default" project always exists.
message Project {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  ProjectSpec spec = 4;
}

message ProjectSpec {
  // Shown in the portal. At most 200 bytes.
  string display_name = 1;
  // At most 200 bytes.
  string description = 2;
}

// ResourceQuota caps the total usage of the project-scoped objects in one
// project (ADR 0023, section 7). The quota is checked when objects are
// applied. An empty field is unlimited.
message ResourceQuota {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  ResourceQuotaSpec spec = 4;
}

message ResourceQuotaSpec {
  // Sum over Workloads of replicas times resources.cpu, e.g. "4" or "2000m".
  string cpu = 1;
  // Sum over Workloads of replicas times resources.memory, e.g. "8Gi".
  string memory = 2;
  // Number of Workloads. Unset is unlimited; 0 allows none.
  optional int32 workloads = 3;
  // Sum of Volume sizes, e.g. "100Gi".
  string storage = 4;
}

// Environment is a named deploy target (ADR 0022, section 10). A deploy job
// names one and sets one of its Workloads. The controller owns its status. The
// project label records the owning project (ADR 0023).
message Environment {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  EnvironmentSpec spec = 4;
  EnvironmentStatus status = 5;
}

message EnvironmentSpec {
  // Shown in the portal. Only http and https URLs.
  string url = 1;
  // A protected environment's deploys wait for approval.
  bool protected = 2;
  // Approvals a gated job needs. Zero means 1 (ADR 0022, section 10).
  int32 required_approvals = 3;
  // The Workloads a deploy job of this environment may set.
  repeated string workloads = 4;
}

message EnvironmentStatus {
  // The digest the last successful deploy set, and the one before it. The
  // previous digest is the rollback target for an operator (ADR 0022).
  string digest = 1;
  string previous_digest = 2;
  // The last deploys, newest first. At most 10 are kept.
  repeated EnvironmentDeployment deployments = 3;
}

// EnvironmentDeployment is one deploy job's result in an environment.
message EnvironmentDeployment {
  string run = 1;
  string job = 2;
  string workload = 3;
  string image = 4;
  string digest = 5;
  // Phase of the deploy job when it ended: Complete or Failed.
  string phase = 6;
  string message = 7;
  // The approvals the job had when it deployed, as "name" entries.
  repeated string approved_by = 8;
  google.protobuf.Timestamp at = 9;
}
